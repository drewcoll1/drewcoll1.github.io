<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Promotions LLC</title>
    <link rel="icon" href="/images/favicon.png" type="image/jpeg" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Barlow+Condensed:wght@500;700&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tiny-slider/2.9.4/tiny-slider.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tiny-slider/2.9.4/min/tiny-slider.js"></script>

    <style>
        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .brand-font {
            font-family: "Bebas Neue", sans-serif;
        }

        .header-shell {
            max-width: 120rem;
            margin-left: auto;
            margin-right: auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .header-logo {
            height: 6rem;
            width: auto;
            border-radius: 9999px;
            border: 2px solid #ffffff;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1),
                0 8px 10px -6px rgb(0 0 0 / 0.1);
            transition: transform 0.3s ease;
        }

        .header-logo:hover {
            transform: scale(1.05);
        }

        .header-brand-text {
            display: none;
        }

        @media (min-width: 1024px) {
            .header-brand-text {
                display: flex;
                flex-direction: column;
                color: #000000;
                font-size: 2.25rem;
                line-height: 1.05;
                letter-spacing: 0.025em;
            }
        }

        .header-contact-line {
            font-size: 1.25rem;
            color: #60a5fa;
            padding-top: 0.18rem;
            padding-bottom: 0.18rem;
        }

        .header-contact-line.email {
            font-style: italic;
        }

        #nav-menu {
            display: none;
        }

        @media (min-width: 768px) {
            #nav-menu {
                position: relative;
                display: flex !important;
                width: auto;
                height: auto;
                overflow: visible;
                background: transparent;
                flex-direction: row;
                justify-content: flex-end;
                align-items: center;
                gap: 2.5rem;
                padding-top: 0;
            }
        }

        @media (max-width: 767px) {
            .header-shell {
                padding: 0.9rem 1rem;
                justify-content: center;
                align-items: center;
            }

            .header-shell>a img.header-logo {
                display: none !important;
            }

            .header-brand-text {
                display: none !important;
            }

            .header-shell>a {
                display: none;
            }

            #nav-menu {
                display: flex !important;
                position: relative;
                width: 100%;
                justify-content: center;
                align-items: center;
                gap: 1.15rem;
                white-space: nowrap;
            }

            #nav-menu a {
                flex: 0 0 auto;
            }

            #nav-menu .brand-font {
                font-size: 1.8rem !important;
                line-height: 1;
            }
        }
    </style>
</head>

<body>

<div class="site-shell min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-white backdrop-blur-lg shadow-xl border-b border-transparent">
        <div class="header-shell">
            <a href="index.html" class="flex items-center gap-4">
                <img src="./images/logo.png" alt="Prime Promotions Logo" class="header-logo" />

                <span class="header-brand-text brand-font">
                    <span class="whitespace-nowrap font-semibold">Prime Promotions LLC</span>
                    <span class="header-contact-line">(574) 202-7050</span>
                    <span class="header-contact-line email">sales@primepromollc.com</span>
                </span>
            </a>

            <nav id="nav-menu">
                <a href="index.html" class="relative group">
                    <span class="text-blue-400 transition brand-font text-4xl">
                        Home
                    </span>

                    <span
                        class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-400 scale-x-100 transition-transform origin-left">
                    </span>
                </a>

                <a href="products.html" class="relative group">
                    <span class="text-black hover:text-blue-400 transition brand-font text-4xl">
                        Catalogs
                    </span>

                    <span
                        class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-400 scale-x-0 group-hover:scale-x-100 transition-transform origin-left">
                    </span>
                </a>

                <a href="shopify.html" class="relative group">
                    <span class="text-black hover:text-blue-400 transition brand-font text-4xl">
                        Shopify
                    </span>

                    <span
                        class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-400 scale-x-0 group-hover:scale-x-100 transition-transform origin-left">
                    </span>
                </a>

                <a href="contact.html" class="relative group">
                    <span class="text-black hover:text-blue-400 transition brand-font text-4xl">
                        Contact
                    </span>

                    <span
                        class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-400 scale-x-0 group-hover:scale-x-100 transition-transform origin-left">
                    </span>
                </a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-32">
        <h1 class="brand-font text-7xl text-slate-900">
            NAV SHIFT FIXED<span class="text-blue-400">.</span>
        </h1>
    </main>

</div>

</body>
</html>
